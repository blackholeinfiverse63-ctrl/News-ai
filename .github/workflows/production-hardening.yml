name: Production Hardening CI

on:
  push:
    branches:
      - main
    tags:
      - 'stable-v1*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        cd unified_tools_backend
        pip install -r requirements.txt
    - name: Run contract tests
      run: |
        cd unified_tools_backend
        python -m pytest tests/test_api_contracts.py -v
    - name: Run idempotency tests
      run: |
        cd unified_tools_backend
        python -m pytest tests/test_idempotency.py -v
    - name: Run deterministic behavior tests
      run: |
        cd unified_tools_backend
        python -m pytest tests/test_deterministic_behavior.py -v
    - name: Run load sanity tests
      run: |
        cd unified_tools_backend
        python -m pytest tests/test_load_sanity.py -v
    - name: Run integration validation tests
      run: |
        cd unified_tools_backend
        python -m pytest tests/test_integration_assumptions.py -v
    - name: Validate reliability documentation
      run: |
        # Check if docs exist
        if [ ! -f docs/reliability_guide.md ]; then
          echo "Reliability documentation missing"
          exit 1
        fi
    - name: Validate scheduler documentation
      run: |
        if [ ! -f docs/scheduler_behavior_documentation.md ]; then
          echo "Scheduler behavior documentation missing"
          exit 1
        fi
    - name: Tag stable-v1 only if all tests pass
      if: startsWith(github.ref, 'refs/tags/stable-v1')
      run: echo "All hardening tests passed for stable-v1"